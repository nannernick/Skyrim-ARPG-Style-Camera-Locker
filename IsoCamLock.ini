[IsoCamLock]
; Master switch at game start. The toggle key flips it in game.
bEnabled = 1

; Lock each axis separately. Yaw is free by default so you can rotate with the mouse.
bLockYaw = 0
bLockPitch = 1

; World heading the camera faces, in degrees. 0 = north, 90 = east, 180 = south, 270 = west.
; 45 gives the classic diagonal ARPG look.
fYaw = 45

; How far the camera looks down, in degrees. Higher = more top-down.
fPitch = 55

; How pitch is applied. Try 0 first. If pitch doesn't hold or the character tilts oddly, try 1.
; 0 = write the player's pitch angle (what vanilla 3rd person uses)
; 1 = write the camera's own free-rotation pitch
iPitchMode = 0

; Set to 1 if the camera ends up looking at the sky instead of the ground.
bInvertPitch = 0

; Toggle key as a DirectInput scan code. 0x44 = F10. 0x43 = F9, 0x57 = F11.
iToggleKey = 0x44

; Stop locking while True Directional Movement's target lock is on, so TDM holds the camera.
bPauseOnTargetLock = 1

; Ceilings (interiors only). Press the key to hide everything that sits entirely above your head.
; 0x43 = F9.
iCeilingKey = 0x43
; How far above your feet an object's lowest point must be to count as ceiling (game units, ~128 = player height).
; Raise it if wall tops or door frames disappear; lower it if low ceilings stay.
fCeilingClearance = 200
; Start with ceilings hidden.
bCeilingsHiddenAtStart = 0

; Writes camera values to Documents\My Games\Skyrim Special Edition\SKSE\IsoCamLock.log once a second.
; Turn on if something behaves wrong and send me the log.
bDebugLog = 0
