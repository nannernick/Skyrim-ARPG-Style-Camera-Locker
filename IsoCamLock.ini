[IsoCamLock]
; Master switch at game start. F10 flips it in game.
bEnabled = 1

; Yaw is free so you can rotate with the mouse; pitch is locked.
bLockYaw = 0
bLockPitch = 1

; Camera heading in degrees, only used if bLockYaw = 1. 0 = north, 90 = east.
fYaw = 45

; Degrees looking down. 30 = Path of Exile 2. Page Up / Page Down change it in game and save it here.
fPitch = 30

; Keep both at 0. Mode 1 points the camera at the ground.
iPitchMode = 0
bInvertPitch = 0

; Leave at 0. TDM 2.3.x doesn't report target lock this way.
bPauseOnTargetLock = 0

; Indoors, draw the room you're standing in even when the camera is above the ceiling.
; Set to 0 if you also run Skyrim Camera Disocclusion System (it does the same thing).
bFixInteriorRooms = 1

; Ceilings indoors. Objects whose lowest point is this far above your feet get hidden (game units).
fCeilingClearance = 200
bCeilingsHiddenAtStart = 0

; Keys (DirectInput scan codes)
iToggleKey = 0x44      ; F10  camera lock on/off
iCeilingKey = 0x43     ; F9   ceilings on/off
iPitchUpKey = 0x49     ; Page Up    more top-down
iPitchDownKey = 0x51   ; Page Down  flatter
fPitchStep = 5
iReloadKey = 0x42      ; F8   reload this file

; Writes camera values to My Games\Skyrim Special Edition\SKSE\IsoCamLock.log once a second.
bDebugLog = 0

[Player]
; Character stats, applied every time a save loads. 0 = leave the game's value alone.
; Carry weight high enough that you never get over-encumbered.
fCarryWeight = 10000
; Movement speed. 100 = vanilla.
fSpeedMult = 130

[GameSettings]
; Engine settings, re-applied every launch. Any game setting name works here (the same names `setgs` uses).
; Armor weight no longer slows you down.
fMoveEncumEffect = 0
fMoveEncumEffectNoWeapon = 0
